; =============================================================================
; PHP Security Hardening Settings
;
; Add these to your php.ini or create a separate file:
;   /etc/php/8.x/fpm/conf.d/99-security.ini
;
; After changes: sudo systemctl restart php8.x-fpm
;
; NOTE: Some settings may conflict with Laravel features. Test after applying.
; Settings marked [CAUTION] may need adjustment for your specific setup.
; =============================================================================

; --- Hide PHP version from response headers ---
expose_php = Off

; --- Error handling (NEVER show errors to users in production) ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
html_errors = Off

; --- Disable dangerous functions ---
; [CAUTION] proc_open is needed by Composer and some queue workers
; [CAUTION] putenv is needed by vlucas/phpdotenv
; Remove functions from this list if your app needs them
disable_functions = exec,passthru,shell_exec,system,popen,curl_multi_exec,parse_ini_file,show_source

; --- File system restrictions ---
; [CAUTION] Adjust path to match your setup. Include /tmp for file uploads.
; open_basedir = /home/forge/yoursite.com:/tmp:/var/lib/php/sessions
allow_url_include = Off
enable_dl = Off

; --- Resource limits ---
max_execution_time = 30
max_input_time = 60
memory_limit = 256M
post_max_size = 25M
upload_max_filesize = 25M
max_file_uploads = 5
max_input_vars = 5000

; --- Session security ---
session.use_strict_mode = 1
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.use_trans_sid = 0
session.sid_length = 128
session.sid_bits_per_character = 6

; --- Prevent information leakage in stack traces ---
zend.exception_ignore_args = On

; --- Report memory leaks ---
report_memleaks = On

; --- FastCGI fix (required for Nginx) ---
cgi.fix_pathinfo = 0
