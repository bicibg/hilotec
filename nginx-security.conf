# =============================================================================
# Nginx Security Configuration - Laravel Application
#
# Include this in your nginx server block BEFORE the main location / {} block:
#   include /path/to/your/project/nginx-security.conf;
#
# ALSO add these rate limiting zones to /etc/nginx/nginx.conf inside http {}:
#   limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
#   limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
#   limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
# =============================================================================

# ---------------------------------------------------------------------------
# Block hidden files and directories (.git, .env, .htaccess, etc.)
# Exception: .well-known for SSL and security.txt
# ---------------------------------------------------------------------------
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
}

# ---------------------------------------------------------------------------
# Block PHP execution in asset/upload directories
# THIS IS THE #1 DEFENSE against the web shell / phishing injection attack
# ---------------------------------------------------------------------------
location ~* ^/(css|js|images|build|storage|fonts|uploads|assets|media|vendor)/.+\.php$ {
    deny all;
    access_log /var/log/nginx/blocked-php-execution.log;
}

# ---------------------------------------------------------------------------
# Block dangerous file types everywhere
# ---------------------------------------------------------------------------
location ~* \.(phtml|php3|php4|php5|php7|phps|cgi|pl|py|sh|bash|asp|aspx|jsp)$ {
    deny all;
    access_log /var/log/nginx/blocked-suspicious-files.log;
}

# ---------------------------------------------------------------------------
# Block common attack/scanner paths
# ---------------------------------------------------------------------------
location ~* (wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|adminer|myadmin) {
    deny all;
    access_log off;
    return 444;
}

# ---------------------------------------------------------------------------
# Block access to sensitive files
# ---------------------------------------------------------------------------
location ~* \.(sql|sqlite|sqlite3|bak|log|ini|conf|yml|yaml|lock|env|htpasswd|htaccess)$ {
    deny all;
    access_log off;
}

# Allow specific files that match the patterns above
location = /build/manifest.json { allow all; }
location = /site.webmanifest { allow all; }
location = /robots.txt { allow all; }

# ---------------------------------------------------------------------------
# Block access to Laravel internals
# ---------------------------------------------------------------------------
location ~* (artisan|composer\.(json|lock)|package\.(json|lock)|webpack\.mix\.js) {
    deny all;
}

# ---------------------------------------------------------------------------
# Block exploit patterns in query strings
# ---------------------------------------------------------------------------
if ($query_string ~* "(eval\(|base64_decode|gzinflate|str_rot13|system\(|exec\(|passthru\(|shell_exec\()") {
    return 403;
}

# ---------------------------------------------------------------------------
# Block common vulnerability scanners by user agent
# ---------------------------------------------------------------------------
if ($http_user_agent ~* (nikto|sqlmap|nmap|masscan|zgrab|gobuster|dirbuster|wpscan|nessus|acunetix|havij|w3af)) {
    return 444;
}

# ---------------------------------------------------------------------------
# Rate limit admin login (uncomment after adding zones to nginx.conf http {})
# ---------------------------------------------------------------------------
# location = /admin/login {
#     limit_req zone=admin_login burst=3 nodelay;
#     try_files $uri $uri/ /index.php?$query_string;
# }

# ---------------------------------------------------------------------------
# Limit concurrent connections per IP (uncomment after adding zone)
# ---------------------------------------------------------------------------
# limit_conn conn_limit 20;

# ---------------------------------------------------------------------------
# Security headers (backup - also set in Laravel middleware)
# ---------------------------------------------------------------------------
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# ---------------------------------------------------------------------------
# Hide server version
# ---------------------------------------------------------------------------
server_tokens off;

# ---------------------------------------------------------------------------
# Limit request body size (adjust for your upload limits)
# ---------------------------------------------------------------------------
client_max_body_size 25m;

# ---------------------------------------------------------------------------
# Timeouts to prevent slowloris and other DoS attacks
# ---------------------------------------------------------------------------
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 10s;
